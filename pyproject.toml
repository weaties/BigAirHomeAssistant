[project]
name = "bigair"
version = "0.1.0"
description = "Sprinter van telemetry — fuel model, range, fill-ups and long-term history"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "aiomqtt>=2.5.1",
    "anthropic>=2.14.0",
    "loguru>=0.8.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
bigair = "bigair.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigair"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (same rule set as HelmLog)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (enforce type hints)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["bigair"]

# ---------------------------------------------------------------------------
# Mypy — strict, zero-error baseline from day one (no allowlist)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
xfail_strict = true
addopts = "--cov=src/bigair --cov-report=term-missing"

[tool.coverage.run]
source = ["src/bigair"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261122",
    "yamllint>=1.38.0",
]
