# Installed by deploy/bootstrap.sh as /etc/chrony/conf.d/bigair-gps.conf.
# System time from the GPS (CLAUDE.md Decision #24, issue #22): chrony reads the
# time gpsd publishes in shared memory segment 0 (NTP0, root-only, written by
# gpsd for its first device).
#
# offset 0.095 — measured 2026-11-19 against NTP for the Dual XGPS160 over
#   Bluetooth: NMEA time arrived 92–97 ms late (stddev ≈ 1 ms over 8 min);
#   with this offset it tracked NTP within ±2 ms. Re-measure if the receiver
#   or the Bluetooth link changes (docs/scans/2026-11-19-xgps160-trial.md).
# precision/delay — deliberately loose (±100 ms class). Online, chrony prefers
#   the internet NTP pool; offline in the van, GPS is the only source and keeps
#   the clock right. That's plenty for 1 Hz telemetry timestamps.
refclock SHM 0 refid GPS precision 1e-1 offset 0.095 delay 0.2
