# Local-only broker on the van hotspot. M1: add password_file + ACLs before
# exposing beyond the Pi's private network.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# Default is 1800 s. Retained messages (HA discovery, display copies of fuel
# state) are saved to disk this often. bigair's own state file, not the broker,
# is the source of truth for the tank (CLAUDE.md → Architecture).
autosave_interval 60
log_dest stdout
