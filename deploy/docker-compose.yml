# BigAir in-van stack — Raspberry Pi OS + Docker Compose (CLAUDE.md → Decisions #2).
# Everything local; no service needs internet at runtime.
# Image tags are pinned; dependabot bumps them.
name: bigair

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./volumes/mosquitto/data:/mosquitto/data
      - ./volumes/mosquitto/log:/mosquitto/log

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    restart: unless-stopped
    network_mode: host  # mDNS, Bluetooth (Victron BLE), Companion app discovery
    privileged: true  # Bluetooth adapter access
    volumes:
      - ../homeassistant:/config
      - /run/dbus:/run/dbus:ro
    environment:
      TZ: ${TZ}

  influxdb:
    image: influxdb:2.7.11
    restart: unless-stopped
    ports: ["8086:8086"]
    volumes:
      - ./volumes/influxdb:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: bigair
      DOCKER_INFLUXDB_INIT_BUCKET: van_raw
      DOCKER_INFLUXDB_INIT_RETENTION: 400d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN}

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [influxdb]
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ./volumes/grafana:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Read-only dashboards without a login, for the phone (Decision #38). Viewer
      # can't edit or query freely beyond the provisioned panels' datasources.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      INFLUX_GRAFANA_TOKEN: ${INFLUX_GRAFANA_TOKEN}

  # gpsd runs on the Pi host, not here (CLAUDE.md Decision #28): the Bluetooth
  # RFCOMM binding and chrony's SHM refclock both live on the host.

  display:
    # Dash fuel gauge frames for the LilyGo T5 S3 PRO (eink-screen firmware), Decision #29.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bigair:local
    restart: unless-stopped
    command:
      - uv
      - run
      - --no-sync
      - bigair
      - display
      - --port
      - "8090"
      - --preview-port
      - "8091"
    ports:
      - "8090:8090"  # device frames, Bearer key, van LAN
      # Keyless browser preview (#62): loopback only, so never on the van LAN;
      # `tailscale serve` publishes it to the tailnet (Decision #37).
      - "127.0.0.1:${DISPLAY_PREVIEW_PORT:-8091}:8091"
    environment:
      TZ: ${TZ}
      DISPLAY_API_KEY: ${DISPLAY_API_KEY}
      DISPLAY_REFRESH_SECONDS: ${DISPLAY_REFRESH_SECONDS:-60}
      DISPLAY_FULL_REFRESH_SECONDS: ${DISPLAY_FULL_REFRESH_SECONDS:-600}
      # /run/bigair/debug.json adds Pi supply and uptime to the Van screen (#62).
      DISPLAY_DEBUG_FILE: ${DISPLAY_DEBUG_FILE:-}
      DISPLAY_GAUGE_FILE: /feed/gauge.json  # written by the bigair service (#17)
    volumes:
      - /run/bigair:/run/bigair:ro  # written by deploy/host/bigair-debug.service
      - gauge-feed:/feed:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3

  bigair:
    image: bigair:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Fuel service (#53): WiCAN → fuel model → state file, HA over MQTT, InfluxDB.
    command: ["uv", "run", "--no-sync", "bigair", "run"]
    depends_on: [mosquitto, influxdb]
    env_file: .env
    # Host networking (Decision #35): gpsd listens on the host's localhost only, and
    # Mosquitto/InfluxDB publish their ports on the host anyway.
    network_mode: host
    environment:
      MQTT_HOST: localhost
      INFLUX_URL: http://localhost:8086
      GPSD_HOST: 127.0.0.1
      BIGAIR_STATE_FILE: /data/fuel_state.json
      BIGAIR_GAUGE_FILE: /feed/gauge.json
    volumes:
      - ../data/bigair:/data  # durable fuel state (Decision #22); gitignored
      - gauge-feed:/feed  # dash display copy (#17), not durable
    stop_grace_period: 15s  # time to save state on SIGTERM

  planner:
    # Trip planner page (#75): fuel stops per reserve depth and weather along the
    # route. Open it at http://bigair-ha.local:8092/ on the van Wi-Fi, from the
    # HA "Trip" view, or over the tailnet. Planning needs internet; the last plan
    # is cached for offline viewing. Plans are capped per day (Google costs money).
    image: bigair:local
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "bigair", "planner"]
    depends_on: [mosquitto]
    env_file: .env  # GOOGLE_MAPS_API_KEY, EIA_API_KEY
    # Host networking (Decision #35): the tank comes from Mosquitto on localhost and
    # "current location" from gpsd, which listens on the host's localhost only.
    network_mode: host
    environment:
      MQTT_HOST: localhost
      PLANNER_PORT: 8092  # the healthcheck below assumes it
      PLANNER_CACHE: /data/trip-plan.json
      PLANNER_DAILY_LIMIT: ${PLANNER_DAILY_LIMIT:-20}
    volumes:
      - ../data/bigair:/data  # cached last plan; gitignored
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gauge-feed:  # bigair service → dash display (#17)
