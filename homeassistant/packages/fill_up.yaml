# Fill-up logging (#12). HA only collects input and shows results; parsing,
# validation, duplicate protection and the fuel model live in bigair (Python).
# See /fill-up-events.
#
#   script.log_fill_up       → actionable notification on the phone. Reply under
#                              Full or Partial with "gallons price", e.g. 22.4 4.19.
#                              Add it to CarPlay Quick access in the Companion app.
#   script.submit_fill_up_form → the dashboard form (helpers below).
#   bigair/fill_up/result    → notification back with what was logged, or why not.
#   bigair/fill_up/candidate → bigair detected a fill: prompt with Full / Partial /
#                              Later / Not a fill (#11). Re-prompts reuse the tag.
#   bigair/fill_up/expired   → 3 prompts unanswered: persistent notification.
#
# The phone's notify action comes from secrets.yaml (mobile_app_notify), so the
# device name never lands in this public repo.

input_number:
  fill_up_gallons:
    name: Fill-up gallons
    min: 0
    max: 60
    step: 0.001
    mode: box
    unit_of_measurement: gal
  fill_up_price_per_gal:
    name: Price per gallon
    min: 0
    max: 15
    step: 0.001
    mode: box
    unit_of_measurement: USD/gal

input_select:
  fill_up_type:
    name: Fill type
    options:
      - full
      - partial

script:
  log_fill_up:
    alias: Log fill-up
    icon: mdi:gas-station
    description: >-
      Ask on the phone for gallons and price (works from CarPlay Quick access).
    sequence:
      - variables:
          fill_id: "manual-{{ now().timestamp() | int }}"
      - action: !secret mobile_app_notify
        data:
          title: Log fill-up
          message: "Reply under Full or Partial with gallons, then price — e.g. 22.4 4.19"
          data:
            tag: "{{ fill_id }}"
            actions:
              - action: "BIGAIR_FILL_FULL::{{ fill_id }}"
                title: Full
                behavior: textInput
                textInputButtonTitle: Log
                textInputPlaceholder: "22.4 4.19"
              - action: "BIGAIR_FILL_PARTIAL::{{ fill_id }}"
                title: Partial
                behavior: textInput
                textInputButtonTitle: Log
                textInputPlaceholder: "10.5 4.19"

  submit_fill_up_form:
    alias: Submit fill-up form
    icon: mdi:send
    description: Send the fill-up form (gallons, price, full/partial) to bigair.
    sequence:
      - action: mqtt.publish
        data:
          topic: bigair/fill_up/response
          payload: >-
            {"fill_id": "form-{{ now().timestamp() | int }}",
             "kind": "{{ states('input_select.fill_up_type') }}",
             "gallons": {{ states('input_number.fill_up_gallons') | float(0) }},
             "price_per_gal": {{ states('input_number.fill_up_price_per_gal') | float(0) }}}
      - action: input_number.set_value
        target:
          entity_id: [input_number.fill_up_gallons, input_number.fill_up_price_per_gal]
        data:
          value: 0

automation:
  - id: bigair_fill_up_prompt
    alias: Detected fill-up → phone prompt
    description: >-
      bigair detected a fill (or is re-prompting). Same tag as earlier prompts for
      this fill, so a re-prompt replaces the old notification.
    triggers:
      - trigger: mqtt
        topic: bigair/fill_up/candidate
    actions:
      - action: !secret mobile_app_notify
        data:
          title: "Fill-up detected (~{{ trigger.payload_json.est_gallons }} gal)"
          message: >-
            Reply under Full or Partial with gallons, then price — e.g. 22.4 4.19
            {%- if trigger.payload_json.attempt > 1 %} (reminder {{ trigger.payload_json.attempt }}/3){% endif %}
          data:
            tag: "{{ trigger.payload_json.fill_id }}"
            actions:
              - action: "BIGAIR_FILL_FULL::{{ trigger.payload_json.fill_id }}"
                title: Full
                behavior: textInput
                textInputButtonTitle: Log
                textInputPlaceholder: "22.4 4.19"
              - action: "BIGAIR_FILL_PARTIAL::{{ trigger.payload_json.fill_id }}"
                title: Partial
                behavior: textInput
                textInputButtonTitle: Log
                textInputPlaceholder: "10.5 4.19"
              - action: "BIGAIR_FILL_LATER::{{ trigger.payload_json.fill_id }}"
                title: Later
              - action: "BIGAIR_FILL_SKIP::{{ trigger.payload_json.fill_id }}"
                title: Not a fill
                destructive: true

  - id: bigair_fill_up_expired
    alias: Unanswered fill-up → persistent notice
    description: Three prompts went unanswered; leave a notice so it can still be logged.
    triggers:
      - trigger: mqtt
        topic: bigair/fill_up/expired
    actions:
      - action: persistent_notification.create
        data:
          notification_id: "bigair_fill_{{ trigger.payload_json.fill_id }}"
          title: Unlogged fill-up
          message: >-
            A fill of about {{ trigger.payload_json.est_gallons }} gal was detected at
            {{ as_timestamp(trigger.payload_json.ts) | timestamp_custom('%a %H:%M') }} and
            never answered. The tank model ignored it. Log it with "Log fill-up".

  - id: bigair_fill_up_reply
    alias: Fill-up reply → bigair
    description: Forward the phone's Full/Partial text reply to bigair as-is.
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.action is string
             and trigger.event.data.action.startswith('BIGAIR_FILL_') }}
    actions:
      - action: mqtt.publish
        data:
          topic: bigair/fill_up/response
          # BIGAIR_FILL_<FULL|PARTIAL|LATER|SKIP>::<fill_id> → kind + fill_id, unchanged.
          payload: >-
            {{ {"fill_id": trigger.event.data.action.split('::')[1],
                "kind": trigger.event.data.action.split('::')[0]
                          | replace('BIGAIR_FILL_', '') | lower,
                "text": trigger.event.data.reply_text | default('')} | to_json }}

  - id: bigair_fill_up_result
    alias: Fill-up result → phone
    description: Tell the phone what bigair logged, or why it didn't.
    triggers:
      - trigger: mqtt
        topic: bigair/fill_up/result
    actions:
      - action: !secret mobile_app_notify
        data:
          title: "{{ 'Fill-up logged' if trigger.payload_json.ok else 'Fill-up not logged' }}"
          message: "{{ trigger.payload_json.message }}"
