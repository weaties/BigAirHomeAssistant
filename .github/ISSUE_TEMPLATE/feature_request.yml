name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve? What driving / camping scenario motivates it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions. For logic, name the fixture or test case that proves it.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - "Small — single file or function"
        - "Medium — multiple files, one module"
        - "Large — cross-module or new module"
        - "Not sure"

  - type: checkboxes
    id: hardware
    attributes:
      label: Hardware
      options:
        - label: Needs verification on the real van (PIDs, CAN IDs, wiring) before it can be closed
